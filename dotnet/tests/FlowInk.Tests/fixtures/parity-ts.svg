<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="FlowInk dogfood - how a spec becomes a README diagram - spec JSON → renderer → committed SVG → GitHub README &lt;img&gt;. Animated flows: colored dashes move along request paths; node borders breathe.">
  <title>FlowInk dogfood - how a spec becomes a README diagram</title>
  <defs>
    <pattern id="fi-dark-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1B2737"/>
    </pattern>
  </defs>
  <style>
    .fi-dark-node { fill: #0E1620; stroke: #22304A; stroke-width: 1.2; }
    .fi-dark-edge { stroke: #1F2B3D; stroke-width: 1.5; fill: none; }
    .fi-dark-pulse { animation: fi-dark-pulse 3s ease-in-out infinite; }
    .fi-dark-flow-sky { stroke: #38BDF8; stroke-width: 2; fill: none; stroke-dasharray: 5 11; animation: fi-dark-dash-sky-f 1.5s linear infinite; }
    .fi-dark-flow-sky-b { animation-name: fi-dark-dash-sky-b; }
    .fi-dark-flow-emerald { stroke: #34D399; stroke-width: 2; fill: none; stroke-dasharray: 5 11; animation: fi-dark-dash-emerald-f 1.5s linear infinite; }
    .fi-dark-flow-emerald-b { animation-name: fi-dark-dash-emerald-b; }
    .fi-dark-flow-amber { stroke: #F59E0B; stroke-width: 2; fill: none; stroke-dasharray: 5 11; animation: fi-dark-dash-amber-f 1.5s linear infinite; }
    .fi-dark-flow-amber-b { animation-name: fi-dark-dash-amber-b; }
    .fi-dark-flow-rose { stroke: #F87171; stroke-width: 2; fill: none; stroke-dasharray: 5 11; animation: fi-dark-dash-rose-f 1.5s linear infinite; }
    .fi-dark-flow-rose-b { animation-name: fi-dark-dash-rose-b; }
    .fi-dark-packet { animation: fi-dark-ride 1.5s linear infinite; }
    @keyframes fi-dark-pulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .5; } }
    @keyframes fi-dark-ride { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @keyframes fi-dark-dash-sky-f { to { stroke-dashoffset: -16; } }
    @keyframes fi-dark-dash-sky-b { to { stroke-dashoffset: 16; } }
    @keyframes fi-dark-dash-emerald-f { to { stroke-dashoffset: -16; } }
    @keyframes fi-dark-dash-emerald-b { to { stroke-dashoffset: 16; } }
    @keyframes fi-dark-dash-amber-f { to { stroke-dashoffset: -16; } }
    @keyframes fi-dark-dash-amber-b { to { stroke-dashoffset: 16; } }
    @keyframes fi-dark-dash-rose-f { to { stroke-dashoffset: -16; } }
    @keyframes fi-dark-dash-rose-b { to { stroke-dashoffset: 16; } }
    @media (prefers-reduced-motion: reduce) { .fi-dark-flow-sky, .fi-dark-flow-emerald, .fi-dark-flow-amber, .fi-dark-flow-rose { animation: none; } .fi-dark-pulse, .fi-dark-packet { animation: none; } }
  </style>
  <rect width="1200" height="640" fill="#0B1118"/>
  <rect width="1200" height="640" fill="url(#fi-dark-dots)" opacity=".5"/>
  <text x="40" y="46" style="font: 600 20px ui-sans-serif, system-ui, sans-serif" fill="#E2E8F0">FlowInk dogfood - how a spec becomes a README diagram</text>
  <text x="40" y="68" style="font: 12px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748B">spec JSON → renderer → committed SVG → GitHub README &lt;img&gt;</text>
  <rect x="947.2" y="30" width="212.8" height="26" rx="13" fill="none" stroke="#38BDF8" stroke-opacity=".5"/>
  <text x="1053.6000000000001" y="47" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#38BDF8">generated by flowink render</text>
  <path class="fi-dark-edge" d="M210,351 H380"/>
  <path class="fi-dark-flow-sky" d="M210,351 H380"/>
  <text x="295" y="343" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#38BDF8">read</text>
  <path class="fi-dark-edge" d="M463,192 V300"/>
  <path class="fi-dark-flow-sky" d="M463,192 V300"/>
  <text x="382" y="184" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#38BDF8">renderFlow()</text>
  <path class="fi-dark-edge" d="M550,141 H720"/>
  <path class="fi-dark-flow-emerald" d="M550,141 H720"/>
  <text x="635" y="133" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#34D399">SMIL-free</text>
  <path class="fi-dark-edge" d="M540,351 H720"/>
  <path class="fi-dark-flow-sky" d="M540,351 H720"/>
  <text x="630" y="343" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#38BDF8">write .svg</text>
  <circle class="fi-dark-packet" r="3.5" fill="#7DD3FC" style="offset-path: path('M540,351 H720')"/>
  <path class="fi-dark-edge" d="M807,192 V300"/>
  <path class="fi-dark-flow-amber" d="M807,192 V300"/>
  <text x="554" y="184" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#F59E0B">embed</text>
  <rect class="fi-dark-node" x="40" y="300" width="170" height="102" rx="10"/>
  <text x="60" y="326" style="font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .5px" fill="#E2E8F0">SPEC.JSON</text>
  <text x="60" y="348" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">nodes + edges</text>
  <text x="60" y="366" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">manual coordinates</text>
  <rect class="fi-dark-node fi-dark-pulse" x="380" y="300" width="160" height="102" rx="10"/>
  <text x="400" y="326" style="font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .5px" fill="#E2E8F0">FLOWINK CLI</text>
  <text x="400" y="348" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">flowink render</text>
  <text x="400" y="366" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">spec → svg</text>
  <rect class="fi-dark-node" x="720" y="300" width="177" height="102" rx="10"/>
  <text x="740" y="326" style="font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .5px" fill="#E2E8F0">GIT REPO</text>
  <text x="740" y="348" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">docs/diagrams/*.svg</text>
  <text x="740" y="366" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">committed artifact</text>
  <rect class="fi-dark-node fi-dark-pulse" x="720" y="90" width="170" height="102" rx="10"/>
  <text x="740" y="116" style="font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .5px" fill="#E2E8F0">README</text>
  <text x="740" y="138" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">renders via &lt;img&gt;</text>
  <text x="740" y="156" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">animated on GitHub</text>
  <rect class="fi-dark-node" x="380" y="90" width="170" height="102" rx="10"/>
  <text x="400" y="116" style="font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .5px" fill="#E2E8F0">@FLOWINK/CORE</text>
  <text x="400" y="138" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">geometry · themes</text>
  <text x="400" y="156" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace" fill="#94A3B8">CSS-only animation</text>
</svg>
