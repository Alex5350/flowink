  <text x="938.4" y="47" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #38BDF8 !important" fill="#38BDF8">sky = request · emerald = response · amber = data · rose = miss</text>
