<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Event-driven delivery - the transactional outbox. Animated flows: colored dashes move along request paths; node borders breathe.">
  <title>Event-driven delivery - the transactional outbox</title>
  <defs>
    <pattern id="fi-dark-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1B2737"/>
    </pattern>
  </defs>
  <style>
    .fi-dark-node { fill: #0E1620; stroke: #22304A; stroke-width: 1.2; }
    .fi-dark-edge { stroke: #1F2B3D; stroke-width: 1.5; fill: none; }
    .fi-dark-pulse { animation: fi-dark-pulse 3s ease-in-out infinite; }
    .fi-dark-flow-sky { stroke: #38BDF8; stroke-width: 2; fill: none; stroke-dasharray: 5 11; animation: fi-dark-dash-sky-f 1.5s linear infinite; }
    .fi-dark-flow-sky-b { animation-name: fi-dark-dash-sky-b; }
    .fi-dark-flow-emerald { stroke: #34D399; stroke-width: 2; fill: none; stroke-dasharray: 5 11; animation: fi-dark-dash-emerald-f 1.5s linear infinite; }
    .fi-dark-flow-emerald-b { animation-name: fi-dark-dash-emerald-b; }
    .fi-dark-flow-amber { stroke: #F59E0B; stroke-width: 2; fill: none; stroke-dasharray: 5 11; animation: fi-dark-dash-amber-f 1.5s linear infinite; }
    .fi-dark-flow-amber-b { animation-name: fi-dark-dash-amber-b; }
    .fi-dark-flow-rose { stroke: #F87171; stroke-width: 2; fill: none; stroke-dasharray: 5 11; animation: fi-dark-dash-rose-f 1.5s linear infinite; }
    .fi-dark-flow-rose-b { animation-name: fi-dark-dash-rose-b; }
    .fi-dark-packet { animation: fi-dark-ride 1.5s linear infinite; }
    @keyframes fi-dark-pulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .5; } }
    @keyframes fi-dark-ride { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @keyframes fi-dark-dash-sky-f { to { stroke-dashoffset: -16; } }
    @keyframes fi-dark-dash-sky-b { to { stroke-dashoffset: 16; } }
    @keyframes fi-dark-dash-emerald-f { to { stroke-dashoffset: -16; } }
    @keyframes fi-dark-dash-emerald-b { to { stroke-dashoffset: 16; } }
    @keyframes fi-dark-dash-amber-f { to { stroke-dashoffset: -16; } }
    @keyframes fi-dark-dash-amber-b { to { stroke-dashoffset: 16; } }
    @keyframes fi-dark-dash-rose-f { to { stroke-dashoffset: -16; } }
    @keyframes fi-dark-dash-rose-b { to { stroke-dashoffset: 16; } }
    @media (prefers-reduced-motion: reduce) { .fi-dark-flow-sky, .fi-dark-flow-emerald, .fi-dark-flow-amber, .fi-dark-flow-rose { animation: none; } .fi-dark-pulse, .fi-dark-packet { animation: none; } }
  </style>
  <rect width="1200" height="640" fill="#0B1118" style="fill:#0B1118 !important"/>
  <rect width="1200" height="640" fill="url(#fi-dark-dots)" opacity=".5" style="fill:url(#fi-dark-dots) !important"/>
  <text x="40" y="46" style="font: 600 20px ui-sans-serif, system-ui, sans-serif !important; fill: #E2E8F0 !important" fill="#E2E8F0">Event-driven delivery - the transactional outbox</text>
  <rect x="774.4" y="30" width="385.6" height="26" rx="13" fill="none" stroke="#38BDF8" stroke-opacity=".5" style="fill: none !important; stroke: #38BDF8 !important; stroke-opacity: .5 !important"/>
  <text x="967.2" y="47" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #38BDF8 !important" fill="#38BDF8">sky = request path · amber = delivery · rose = failure</text>
  <path class="fi-dark-edge" d="M200,137 H330" fill="none" stroke="#1F2B3D" stroke-width="1.5" style="stroke: #1F2B3D !important; fill: none !important; stroke-width: 1.5 !important"/>
  <path class="fi-dark-flow-sky" d="M200,137 H330" fill="none" stroke="#38BDF8" stroke-width="2" style="stroke: #38BDF8 !important; fill: none !important; stroke-width: 2 !important; stroke-dasharray: 5 11 !important"/>
  <text x="265" y="129" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #38BDF8 !important" fill="#38BDF8">checkout</text>
  <path class="fi-dark-edge" d="M490,141 H660" fill="none" stroke="#1F2B3D" stroke-width="1.5" style="stroke: #1F2B3D !important; fill: none !important; stroke-width: 1.5 !important"/>
  <path class="fi-dark-flow-sky" d="M490,141 H660" fill="none" stroke="#38BDF8" stroke-width="2" style="stroke: #38BDF8 !important; fill: none !important; stroke-width: 2 !important; stroke-dasharray: 5 11 !important"/>
  <text x="575" y="133" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #38BDF8 !important" fill="#38BDF8">order + outbox</text>
  <circle class="fi-dark-packet" r="3.5" fill="#7DD3FC" style="offset-path: path('M490,141 H660'); fill: #7DD3FC !important"/>
  <path class="fi-dark-edge" d="M740,192 C740,290 905,290 905,400" fill="none" stroke="#1F2B3D" stroke-width="1.5" style="stroke: #1F2B3D !important; fill: none !important; stroke-width: 1.5 !important"/>
  <path class="fi-dark-flow-amber" d="M740,192 C740,290 905,290 905,400" fill="none" stroke="#F59E0B" stroke-width="2" style="stroke: #F59E0B !important; fill: none !important; stroke-width: 2 !important; stroke-dasharray: 5 11 !important"/>
  <text x="823" y="288" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #F59E0B !important" fill="#F59E0B">poll outbox</text>
  <circle class="fi-dark-packet" r="3.5" fill="#7DD3FC" style="offset-path: path('M740,192 C740,290 905,290 905,400'); fill: #7DD3FC !important"/>
  <path class="fi-dark-edge" d="M820,451 H650" fill="none" stroke="#1F2B3D" stroke-width="1.5" style="stroke: #1F2B3D !important; fill: none !important; stroke-width: 1.5 !important"/>
  <path class="fi-dark-flow-amber" d="M820,451 H650" fill="none" stroke="#F59E0B" stroke-width="2" style="stroke: #F59E0B !important; fill: none !important; stroke-width: 2 !important; stroke-dasharray: 5 11 !important"/>
  <text x="735" y="443" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #F59E0B !important" fill="#F59E0B">send</text>
  <circle class="fi-dark-packet" r="3.5" fill="#7DD3FC" style="offset-path: path('M820,451 H650'); fill: #7DD3FC !important"/>
  <path class="fi-dark-edge" d="M240,442 H480" fill="none" stroke="#1F2B3D" stroke-width="1.5" style="stroke: #1F2B3D !important; fill: none !important; stroke-width: 1.5 !important"/>
  <path class="fi-dark-flow-rose fi-dark-flow-sky-b fi-dark-flow-emerald-b fi-dark-flow-amber-b fi-dark-flow-rose-b" d="M240,442 H480" fill="none" stroke="#F87171" stroke-width="2" style="stroke: #F87171 !important; fill: none !important; stroke-width: 2 !important; stroke-dasharray: 5 11 !important"/>
  <text x="360" y="434" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #F87171 !important" fill="#F87171">send failed</text>
  <path class="fi-dark-edge" d="M160,484 C160,572 905,572 905,502" fill="none" stroke="#1F2B3D" stroke-width="1.5" style="stroke: #1F2B3D !important; fill: none !important; stroke-width: 1.5 !important"/>
  <path class="fi-dark-flow-rose" d="M160,484 C160,572 905,572 905,502" fill="none" stroke="#F87171" stroke-width="2" style="stroke: #F87171 !important; fill: none !important; stroke-width: 2 !important; stroke-dasharray: 5 11 !important"/>
  <text x="533" y="520" text-anchor="middle" style="font: 10px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #F87171 !important" fill="#F87171">retry</text>
  <circle class="fi-dark-packet" r="3.5" fill="#7DD3FC" style="offset-path: path('M160,484 C160,572 905,572 905,502'); fill: #7DD3FC !important"/>
  <path class="fi-dark-edge" d="M990,430 C1090,430 1090,141 820,141" fill="none" stroke="#1F2B3D" stroke-width="1.5" style="stroke: #1F2B3D !important; fill: none !important; stroke-width: 1.5 !important"/>
  <path class="fi-dark-flow-sky" d="M990,430 C1090,430 1090,141 820,141" fill="none" stroke="#38BDF8" stroke-width="2" style="stroke: #38BDF8 !important; fill: none !important; stroke-width: 2 !important; stroke-dasharray: 5 11 !important"/>
  <rect class="fi-dark-node" x="40" y="90" width="160" height="84" rx="10" fill="#0E1620" stroke="#22304A" style="fill: #0E1620 !important; stroke: #22304A !important; stroke-width: 1.2 !important"/>
  <text x="60" y="116" style="font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace !important; letter-spacing: .5px !important; fill: #E2E8F0 !important" fill="#E2E8F0">CLIENT</text>
  <text x="60" y="138" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #94A3B8 !important" fill="#94A3B8">checkout page</text>
  <rect class="fi-dark-node fi-dark-pulse" x="330" y="90" width="160" height="102" rx="10" fill="#0E1620" stroke="#22304A" style="fill: #0E1620 !important; stroke: #22304A !important; stroke-width: 1.2 !important"/>
  <text x="350" y="116" style="font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace !important; letter-spacing: .5px !important; fill: #E2E8F0 !important" fill="#E2E8F0">REST API</text>
  <text x="350" y="138" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #94A3B8 !important" fill="#94A3B8">POST /orders</text>
  <text x="350" y="156" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #94A3B8 !important" fill="#94A3B8">one transaction</text>
  <rect class="fi-dark-node" x="660" y="90" width="160" height="102" rx="10" fill="#0E1620" stroke="#22304A" style="fill: #0E1620 !important; stroke: #22304A !important; stroke-width: 1.2 !important"/>
  <text x="680" y="116" style="font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace !important; letter-spacing: .5px !important; fill: #E2E8F0 !important" fill="#E2E8F0">DATABASE</text>
  <text x="680" y="138" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #94A3B8 !important" fill="#94A3B8">orders + outbox</text>
  <text x="680" y="156" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #94A3B8 !important" fill="#94A3B8">one commit</text>
  <rect class="fi-dark-node fi-dark-pulse" x="820" y="400" width="170" height="102" rx="10" fill="#0E1620" stroke="#22304A" style="fill: #0E1620 !important; stroke: #22304A !important; stroke-width: 1.2 !important"/>
  <text x="840" y="426" style="font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace !important; letter-spacing: .5px !important; fill: #E2E8F0 !important" fill="#E2E8F0">WORKER</text>
  <text x="840" y="448" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #94A3B8 !important" fill="#94A3B8">claims rows, sends</text>
  <text x="840" y="466" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #94A3B8 !important" fill="#94A3B8">marks sent</text>
  <rect class="fi-dark-node" x="480" y="400" width="170" height="84" rx="10" fill="#0E1620" stroke="#22304A" style="fill: #0E1620 !important; stroke: #22304A !important; stroke-width: 1.2 !important"/>
  <text x="500" y="426" style="font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace !important; letter-spacing: .5px !important; fill: #E2E8F0 !important" fill="#E2E8F0">EMAIL PROVIDER</text>
  <text x="500" y="448" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #94A3B8 !important" fill="#94A3B8">transactional send</text>
  <rect class="fi-dark-node" x="80" y="400" width="160" height="84" rx="10" fill="#0E1620" stroke="#22304A" style="fill: #0E1620 !important; stroke: #22304A !important; stroke-width: 1.2 !important"/>
  <text x="100" y="426" style="font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace !important; letter-spacing: .5px !important; fill: #E2E8F0 !important" fill="#E2E8F0">RETRY QUEUE</text>
  <text x="100" y="448" style="font: 11px ui-monospace, SFMono-Regular, Menlo, monospace !important; fill: #94A3B8 !important" fill="#94A3B8">backoff + jitter</text>
</svg>
