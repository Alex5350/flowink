name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The workspace lockfile is written by npm 11; Node 22 bundles npm 10,
      # whose resolution rejects it. Install the lockfile's npm first.
      - name: Use the lockfile's npm
        run: npm install -g npm@11.17.0
      - name: Install workspace (root install links @flowink/* packages)
        run: npm install
      - name: Build (core, react, angular, cli)
        run: |
          npm run build
          npm run build -w @flowink/angular
      - name: Angular package packs (compiled entry points)
        run: npm pack -w @flowink/angular --pack-destination /tmp
      - name: CLI installs standalone with zero deps
        run: |
          npm pack -w flowink-cli --pack-destination /tmp
          npm install -g /tmp/flowink-cli-0.1.0.tgz
          flowink render docs/diagrams/architecture.json -o /tmp/ci-cli.svg
          test "$(grep -c '<animate' /tmp/ci-cli.svg)" -eq 0
          npm uninstall -g flowink-cli
      - name: Test (core, react)
        run: npm test
      - name: Dogfood render must stay SMIL-free
        run: |
          node packages/cli/dist/cli.js render docs/diagrams/architecture.json -o /tmp/ci-arch.svg
          test "$(grep -c '<animate' /tmp/ci-arch.svg)" -eq 0

  angular-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the lockfile's npm
        run: npm install -g npm@11.17.0
      - name: Install from repo root (workspace linking for @flowink/angular)
        run: npm install
        working-directory: .
      - name: Demo app compiles with the component
        run: npx ng build

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build dotnet/FlowInk.slnx
      - name: Parity + guarantees
        run: dotnet run --project dotnet/tests/FlowInk.Tests
